{% extends "base.html" %}
{% block content %}
<div id="map"></div>
{% endblock %}

{% block scripts %}
<script>
  const map = L.map("map").setView([{{ center_lat }}, {{ center_lng }}], {{ zoom }});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
</script>
{% endblock %}
